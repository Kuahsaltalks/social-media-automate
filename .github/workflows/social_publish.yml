name: Automated Social Media Publisher

on:
  push:
    paths:
      - 'outputs/queue/**'
  workflow_dispatch:
  schedule:
    # Optional scheduled cron check (e.g. daily at 9am UTC)
    - cron: '0 9 * * *'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic python-dotenv

      - name: Process Queued Social Posts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Future platform secrets:
          # X_API_KEY: ${{ secrets.X_API_KEY }}
          # LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          python -c "print('Checking queue for approved posts to publish...')"
          # When platform API keys are connected, this script dispatches posts to X, LinkedIn, Threads.
