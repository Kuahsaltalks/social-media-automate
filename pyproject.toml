[project]
name = "mitroagents"
version = "0.1.0"
description = "MitroAgents: Autonomous AI agent pipeline converting thoughts & voice notes into strictly character-limited, high-converting content for X, Threads, LinkedIn, Substack, and Carousels."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "strands-agents>=1.0.0",
    "python-telegram-bot>=20.0",
    "playwright>=1.40.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
